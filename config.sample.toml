# Copy your existing Teldrive config.toml and append the [node] sections below.
# Existing sections are accepted. Environment variables override mapped settings.
[server]
port = 3000
[db]
data-source = ''
[db.pool]
max-open-connections = 2
[jwt]
allowed-users = []
[tg]
app-id = 0
app-hash = ''
[tg.uploads]
encryption-key = ''
[node]
host = '127.0.0.1'
public-url = 'https://cloud.webrom.lat'
mode = 'native'
storage-backend = 'telegram'
data-key = ''
data-dir = './var'
database-layout = 'legacy'
database-schema = 'teldrive'
metadata-schema = 'teldrive_node'
owner-user-id = ''
cors-origins = []
allow-iframe = false
[node.limits]
part-size = 16777216
max-file-size = 107374182400
concurrent-transfers = 2
upload-ttl-hours = 168
rate-limit-per-minute = 300
login-rate-per-minute = 10
json-max-bytes = 1048576
download-bots = 20
bot-attempts = 2
bot-retry-seconds = 60
bot-client-pool-size = 2
bot-client-idle-seconds = 30
upload-retry-attempts = 5
job-poll-seconds = 10
job-lease-seconds = 300
job-batch-limit = 1000
pending-retention-days = 30
static-cache-bytes = 16777216
playback-ttl-minutes = 60
media-concurrency = 1
media-threads = 1
media-copy-video = 1
media-analyze-seconds = 1
media-max-width = 1280
media-timeout-seconds = 7200
media-probe-timeout-seconds = 60
media-probe-bytes = 8388608
rclone-max-jobs = 2
rclone-max-cache-gib = 100
rclone-max-cache-hours = 720
rclone-request-seconds = 120
rclone-workspace-bytes = 1073741824

[node.rclone]
# Omit executable to use the pinned client installed under var/tools.
mount-enabled = true
agent-origin = 'http://127.0.0.1:5573'
# mount-root = '/srv/teldrive/mounts'
