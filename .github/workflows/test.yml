name: Node checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: node scripts/install-media.mjs
      - run: node scripts/install-rclone.mjs
      - run: npm test
      - run: node scripts/check-production-install.mjs
      - run: pnpm --dir ui run build
      - run: pnpm --dir ui run typecheck
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: teldrive-nodejs
          path: artifacts/teldrive-nodejs.zip
