name: Mobile builds
on:
  push:
    branches: [main]
    paths: ['ui/**', 'scripts/build-mobile.mjs', 'pnpm-lock.yaml', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui exec playwright install --with-deps chromium webkit
      - run: pnpm --dir ui exec playwright test e2e/client-mobile.spec.ts e2e/client-layout.spec.ts e2e/client-demo.spec.ts e2e/settings-access.spec.ts --project=mobile --project=iphone --workers=2
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-mobile.mjs android
      - run: chmod +x gradlew && ./gradlew assembleDebug bundleRelease --console=plain
        working-directory: ui/android
      - uses: actions/upload-artifact@v4
        with:
          name: teldrive-android-test
          path: |
            ui/android/app/build/outputs/apk/debug/*.apk
            ui/android/app/build/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: xcodebuild -version
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-mobile.mjs ios
      - run: xcodebuild -project ui/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ui/ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - run: mkdir -p artifacts && ditto -c -k --sequesterRsrc --keepParent ui/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app artifacts/teldrive-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: teldrive-ios-simulator
          path: artifacts/teldrive-ios-simulator.zip
