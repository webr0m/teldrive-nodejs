image: node:24
stages: [test]
test:
  stage: test
  script:
    - npm install --global pnpm@11.25.0 --ignore-scripts
    - pnpm install --frozen-lockfile
    - pnpm --dir ui install --ignore-workspace --frozen-lockfile
    - npm run check
    - node scripts/install-media.mjs
    - node scripts/install-rclone.mjs
    - npm test
    - node scripts/check-production-install.mjs
    - pnpm --dir ui run build
    - pnpm --dir ui run typecheck
    - node scripts/package.mjs
  artifacts:
    paths:
      - artifacts/teldrive-nodejs.zip
